<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário planning out</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Pontano+Sans:wght@300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Calendar -->
        <div class="calendar-section">

            <div class="month-year">
                <button onclick="changeMonth(-1)">
                    <img class="nav-arrow" id="nav-arrow-left" src="icons/chevron-up-solid-full.svg"
                        alt="backward month">
                </button>
                <h2 id="monthYear" onclick="openYearModal()">Janeiro de 2009</h2>
                <button onclick="changeMonth(1)">
                    <img class="nav-arrow" src="icons/chevron-up-solid-full.svg" alt="backward month">
                </button>
            </div>

            <div class="calendar-grid" id="calendar">
                <!-- Calendar will be generated by JavaScript -->
            </div>
        </div>

        <!-- Birth Date Details -->
        <div class="birth-details" id="birthDetails">
            <div class="birth-date">
                <div class="date-box">
                    <div class="date-day" id="birthDay">-</div>
                    <div class="date-month" id="birthMonth">-</div>
                </div>
                <div class="birth-info">
                    <h3 id="birthTitle">Selecione uma data</h3>
                    <div class="birth-subtitle" id="birthSubtitle">Clique em um dia para selecionar a data de nascimento
                    </div>
                    <div class="age-info" id="ageInfo"></div>
                </div>
            </div>
            <div class="birth-actions">
                <button class="action-btn" id="confirmBtn" onclick="confirmBirthDate()" disabled>✓ Confirmar
                    Data</button>
                <button class="action-btn" onclick="clearSelection()">✕ Limpar</button>
            </div>
        </div>
    </div>

    <!-- Year Selection Modal -->
    <div class="modal-overlay" id="yearModal">
        <div class="year-modal">
            <div class="modal-header">
                <div class="modal-title">Selecione o ano de nascimento:</div>
            </div>

            <div class="year-grid" id="yearGrid">
                <!-- Years will be generated by JavaScript -->
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeYearModal()">Cancelar</button>
                <button class="modal-btn confirm" onclick="confirmYearSelection()">Confirmar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
