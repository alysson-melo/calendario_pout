<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário planning out</title>
    <link rel="icon" type="image/png" href="icons/Planning-out-logo-page.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Pontano+Sans:wght@300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <!-- Calendar -->
        <div class="calendar-section">
            <div class="month-year">
                <button onclick="changeMonth(-1)">
                    <img id="nav-btn-left" src="icons/chevron-up-solid-full.svg" alt="backward month" />
                </button>
                <h2 id="monthYear" onclick="openYearModal()">Agosto de 2025</h2>
                <button onclick="changeMonth(1)">
                    <img src="icons/chevron-up-solid-full.svg" alt="backward month" />
                </button>
            </div>

            <div class="calendar-grid" id="calendar">
                <!-- Calendar will be generated by JavaScript -->
            </div>
        </div>

        <div class="card-details">
            <div class="card-date">
                <div class="card-date-day"></div>
                <div class="card-date-month"></div>
                <div class="card-date-week"></div>
                <div class="card-date-hour"></div>
            </div>
            <div class="card-description">
                <h3 class="card-title"></h3>
                <div class="card-subtittle"></div>
                <div class="card-icons">
                    <div class="card-presence">
                        <img class="card-presence-icon" src="icons/thumbs-up-solid-full-1.svg" alt="Thumbs Up" />
                        <div class="card-presence-info"></div>
                    </div>
                    <div class="card-songs">
                        <img class="card-song-icon" src="icons/music.svg" alt="musical note" />
                        <div class="card-song-number"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Year Selection Modal -->
    <div class="modal-overlay" id="yearModal">
        <div class="year-modal">
            <div class="modal-header">
                <div class="modal-title">Selecione o ano:</div>
            </div>

            <div class="year-grid" id="yearGrid">
                <!-- Years will be generated by JavaScript -->
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeYearModal()">
                    Cancelar
                </button>
                <button class="modal-btn confirm" onclick="confirmYearSelection()">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
