<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Louvor SJC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 15px;
        }

        .team-photos {
            display: flex;
            gap: -10px;
        }

        .photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4, #45B7D1, #96CEB4, #FECA57);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-left: -10px;
        }

        .photo:first-child {
            margin-left: 0;
        }

        .logo-section {
            flex: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .logo::before {
            content: '🎯';
            font-size: 20px;
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .calendar-section {
            background: #FFFFFF;
            border-radius: 25px;
            padding: 30px;
            color: #333;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .calendar-title {
            font-size: 24px;
            font-weight: bold;
            color: #5A189A;
            text-align: center;
            flex: 1;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            color: #5A189A;
            border-radius: 8px;
            transition: background-color 0.2s;
            font-weight: bold;
        }

        .nav-btn:hover {
            background-color: #E9C3FF;
        }

        .month-year {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .month-year h2 {
            cursor: pointer;
            transition: color 0.2s;
        }

        .month-year h2:hover {
            color: #C77DFF;
        }

        /* Year Selection Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .year-modal {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            max-width: 90vw;
            max-height: 80vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .year-modal {
            transform: scale(1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-title {
            color: #5A189A;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-subtitle {
            color: #666;
            font-size: 14px;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #E5E5E5;
            border-radius: 12px;
        }

        .year-grid::-webkit-scrollbar {
            width: 6px;
        }

        .year-grid::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .year-grid::-webkit-scrollbar-thumb {
            background: #C77DFF;
            border-radius: 3px;
        }

        .year-grid::-webkit-scrollbar-thumb:hover {
            background: #5A189A;
        }

        .year-item {
            padding: 12px 8px;
            text-align: center;
            border-radius: 8px;
            background: #D9D9D9;
            color: #333;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .year-item:hover {
            background: #E9C3FF;
            transform: scale(1.05);
        }

        .year-item.current {
            background: #C77DFF;
            color: #5A189A;
        }

        .year-item.selected {
            background: #5A189A;
            color: #FFFFFF;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .modal-btn.cancel {
            background: #D9D9D9;
            color: #333;
        }

        .modal-btn.cancel:hover {
            background: #C5C5C5;
        }

        .modal-btn.confirm {
            background: #5A189A;
            color: #FFFFFF;
        }

        .modal-btn.confirm:hover {
            background: #4a0e7a;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 20px;
        }

        .day-header {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #5A189A;
            padding: 12px 0;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            position: relative;
            background: #D9D9D9;
            color: #333;
            margin: 2px;
        }

        .day:hover {
            background-color: #E9C3FF;
            transform: scale(1.05);
        }

        .day.today {
            background: #C77DFF;
            color: #5A189A;
            font-weight: 700;
        }

        .day.selected {
            background: #5A189A;
            color: #FFFFFF;
            font-weight: 700;
        }

        .day.has-event {
            background: #5A189A;
            color: #FFFFFF;
            font-weight: 700;
        }

        .day.has-event:hover {
            background: #4a0e7a;
        }

        .day.empty {
            background: transparent;
            cursor: default;
        }

        .day.empty:hover {
            transform: none;
            background: transparent;
        }

        .event-details {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .event-date {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .date-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-width: 60px;
        }

        .date-day {
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
        }

        .date-month {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .event-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .event-subtitle {
            opacity: 0.8;
            font-size: 14px;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background-color 0.2s;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .nav-icon {
            font-size: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="team-photos">
                <div class="photo">A</div>
                <div class="photo">B</div>
                <div class="photo">C</div>
                <div class="photo">D</div>
                <div class="photo">E</div>
            </div>
            <div class="logo-section">
                <div class="logo">
                    Projeto Louvor SJC
                </div>
                <div class="subtitle">Equipe de Louvor</div>
            </div>
        </div>

        <!-- Calendar -->
        <div class="calendar-section">
            <div class="calendar-header">
                <div class="calendar-title">Escalas</div>
            </div>

            <div class="month-year">
                <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
                <h2 id="monthYear" onclick="openYearModal()">Agosto de 2025</h2>
                <button class="nav-btn" onclick="changeMonth(1)">›</button>
            </div>

            <div class="calendar-grid" id="calendar">
                <!-- Calendar will be generated by JavaScript -->
            </div>
        </div>

        <!-- Event Details -->
        <div class="event-details" id="eventDetails">
            <div class="event-date">
                <div class="date-box">
                    <div class="date-day" id="eventDay">16</div>
                    <div class="date-month" id="eventMonth">AGO</div>
                </div>
                <div class="event-info">
                    <h3 id="eventTitle">Louvor&ão</h3>
                    <div class="event-subtitle" id="eventSubtitle">Culto e uma semana</div>
                </div>
            </div>
            <div class="event-actions">
                <button class="action-btn">👍 6/1</button>
                <button class="action-btn">📝 4</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">🗓️</div>
                <div>Escalas</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🎵</div>
                <div>Repertório</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <div>Início</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">💬</div>
                <div>Chat</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">⚙️</div>
                <div>Equipes</div>
            </div>
        </div>
    </div>

    <!-- Year Selection Modal -->
    <div class="modal-overlay" id="yearModal">
        <div class="year-modal">
            <div class="modal-header">
                <div class="modal-title">Selecionar Ano</div>
                <div class="modal-subtitle">Escolha o ano desejado (1940 - 2035)</div>
            </div>

            <div class="year-grid" id="yearGrid">
                <!-- Years will be generated by JavaScript -->
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeYearModal()">Cancelar</button>
                <button class="modal-btn confirm" onclick="confirmYearSelection()">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDate = null;
        let selectedYear = null;

        // Eventos de exemplo - agora incluindo as datas que aparecem roxas na imagem
        const events = {
            '2025-08-03': {
                title: 'Ensaio',
                subtitle: 'Preparação',
                likes: '5/0',
                comments: '2'
            },
            '2025-08-16': {
                title: 'Louvor&ão',
                subtitle: 'Culto e uma semana',
                likes: '6/1',
                comments: '4'
            },
            '2025-08-17': {
                title: 'Domingo',
                subtitle: 'Culto principal',
                likes: '8/0',
                comments: '3'
            },
            '2025-08-27': {
                title: 'Ensaio Especial',
                subtitle: 'Preparação',
                likes: '4/0',
                comments: '1'
            },
            '2025-08-28': {
                title: 'Culto Jovem',
                subtitle: 'Ministração jovem',
                likes: '12/1',
                comments: '7'
            }
        };

        function generateCalendar(year, month) {
            const calendar = document.getElementById('calendar');
            const monthYear = document.getElementById('monthYear');

            const months = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];

            const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'];

            monthYear.textContent = `${months[month]} de ${year}`;
            calendar.innerHTML = '';

            // Add day headers
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.classList.add('day-header');
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startingDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();

            // Add empty cells for days before the first day of the month
            for (let i = 0; i < startingDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.classList.add('day', 'empty');
                calendar.appendChild(emptyDay);
            }

            const todayStr = new Date().toISOString().slice(0, 10);

            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.classList.add('day');
                dayElement.textContent = day;

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                // Check if it's today (day 7)
                if (todayStr === dateStr) {
                    dayElement.classList.add('today');
                }

                // Check if it's selected
                if (selectedDate && selectedDate === dateStr) {
                    dayElement.classList.add('selected');
                }

                // Check if there's an event (days with events get purple background)
                if (events[dateStr]) {
                    dayElement.classList.add('has-event');
                }

                dayElement.addEventListener('click', () => selectDate(dateStr, day));
                calendar.appendChild(dayElement);
            }
        }

        function selectDate(dateStr, day) {
            selectedDate = dateStr;
            generateCalendar(currentDate.getFullYear(), currentDate.getMonth());

            const event = events[dateStr];
            const eventDetails = document.getElementById('eventDetails');

            if (event) {
                eventDetails.classList.remove('hidden');
                document.getElementById('eventDay').textContent = day;
                document.getElementById('eventMonth').textContent = currentDate.toLocaleDateString('pt-BR', { month: 'short' }).toUpperCase();
                document.getElementById('eventTitle').textContent = event.title;
                document.getElementById('eventSubtitle').textContent = event.subtitle;

                const actionBtns = eventDetails.querySelectorAll('.action-btn');
                actionBtns[0].textContent = `👍 ${event.likes}`;
                actionBtns[1].textContent = `📝 ${event.comments}`;
            } else {
                // Show default event info for dates without events
                document.getElementById('eventDay').textContent = day;
                document.getElementById('eventMonth').textContent = currentDate.toLocaleDateString('pt-BR', { month: 'short' }).toUpperCase();
                document.getElementById('eventTitle').textContent = 'Sem eventos';
                document.getElementById('eventSubtitle').textContent = 'Nenhum evento agendado';

                const actionBtns = eventDetails.querySelectorAll('.action-btn');
                actionBtns[0].textContent = '👍 0/0';
                actionBtns[1].textContent = '📝 0';
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            selectedDate = null; // Clear selection when changing months
            generateCalendar(currentDate.getFullYear(), currentDate.getMonth());

            // Hide event details when changing months
            document.getElementById('eventDetails').classList.add('hidden');
        }

        function openYearModal() {
            selectedYear = currentDate.getFullYear();
            generateYearGrid();
            document.getElementById('yearModal').classList.add('active');
        }

        function closeYearModal() {
            document.getElementById('yearModal').classList.remove('active');
            selectedYear = null;
        }

        function generateYearGrid() {
            const yearGrid = document.getElementById('yearGrid');
            const currentYear = new Date().getFullYear();
            const startYear = 1940;
            const endYear = 2035;

            yearGrid.innerHTML = '';

            // Generate all years from 1940 to 2035
            for (let year = endYear; year >= startYear; year--) { // Reverse order (newest first)
                const yearElement = document.createElement('div');
                yearElement.classList.add('year-item');
                yearElement.textContent = year;

                if (year === currentYear) {
                    yearElement.classList.add('current');
                }

                if (year === selectedYear) {
                    yearElement.classList.add('selected');
                }

                yearElement.addEventListener('click', () => selectYear(year));
                yearGrid.appendChild(yearElement);
            }

            // Auto-scroll to selected year or current year
            setTimeout(() => {
                const targetElement = document.querySelector('.year-item.selected') ||
                    document.querySelector('.year-item.current');
                if (targetElement) {
                    targetElement.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            }, 100);
        }

        function selectYear(year) {
            selectedYear = year;

            // Update visual selection
            document.querySelectorAll('.year-item').forEach(item => {
                item.classList.remove('selected');
                if (parseInt(item.textContent) === year) {
                    item.classList.add('selected');
                }
            });
        }

        function confirmYearSelection() {
            if (selectedYear !== null) {
                currentDate.setFullYear(selectedYear);
                selectedDate = null; // Clear selection when changing year
                generateCalendar(currentDate.getFullYear(), currentDate.getMonth());

                // Hide event details when changing year
                document.getElementById('eventDetails').classList.add('hidden');
            }
            closeYearModal();
        }

        // Initialize calendar
        generateCalendar(currentDate.getFullYear(), currentDate.getMonth());

        // Set default selection to day 16
        setTimeout(() => {
            selectDate('2025-08-16', 16);
        }, 100);

        // Navigation items
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Close modal when clicking outside
        document.getElementById('yearModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeYearModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeYearModal();
            }
        });
    </script>
</body>

</html>
