<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário planning out</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="team-photos">
                <div class="photo">A</div>
                <div class="photo">B</div>
                <div class="photo">C</div>
                <div class="photo">D</div>
                <div class="photo">E</div>
            </div>
            <div class="logo-section">
                <div class="logo">
                    Projeto Louvor SJC
                </div>
                <div class="subtitle">Equipe de Louvor</div>
            </div>
        </div>

        <!-- Calendar -->
        <div class="calendar-section">
            <div class="calendar-header">
                <div class="calendar-title">Escalas</div>
            </div>

            <div class="month-year">
                <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
                <h2 id="monthYear" onclick="openYearModal()">Agosto de 2025</h2>
                <button class="nav-btn" onclick="changeMonth(1)">›</button>
            </div>

            <div class="calendar-grid" id="calendar">
                <!-- Calendar will be generated by JavaScript -->
            </div>
        </div>

        <!-- Event Details -->
        <div class="event-details" id="eventDetails">
            <div class="event-date">
                <div class="date-box">
                    <div class="date-day" id="eventDay">16</div>
                    <div class="date-month" id="eventMonth">AGO</div>
                </div>
                <div class="event-info">
                    <h3 id="eventTitle">Louvor&ão</h3>
                    <div class="event-subtitle" id="eventSubtitle">Culto e uma semana</div>
                </div>
            </div>
            <div class="event-actions">
                <button class="action-btn">👍 6/1</button>
                <button class="action-btn">📝 4</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">🗓️</div>
                <div>Escalas</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🎵</div>
                <div>Repertório</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🏠</div>
                <div>Início</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">💬</div>
                <div>Chat</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">⚙️</div>
                <div>Equipes</div>
            </div>
        </div>
    </div>

    <!-- Year Selection Modal -->
    <div class="modal-overlay" id="yearModal">
        <div class="year-modal">
            <div class="modal-header">
                <div class="modal-title">Selecionar Ano</div>
                <div class="modal-subtitle">Escolha o ano desejado (1940 - 2035)</div>
            </div>

            <div class="year-grid" id="yearGrid">
                <!-- Years will be generated by JavaScript -->
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeYearModal()">Cancelar</button>
                <button class="modal-btn confirm" onclick="confirmYearSelection()">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
